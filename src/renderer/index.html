<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Verql</title>
    <style>
      /* Pre-React boot splash. Lives entirely outside the bundle so it paints
         on the very first frame — bridging the window-shown → JS-evaluated
         gap that used to flash a white page. The React-side <SplashScreen>
         takes over once the bundle mounts, then dismisses this element with
         a short fade. */
      html, body { margin: 0; padding: 0; background: #0B0F16; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0B0F16;
        color: #F2F4F7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        opacity: 1;
        transition: opacity 240ms ease-out;
        -webkit-app-region: drag;
      }
      #boot-splash.boot-splash--leaving { opacity: 0; pointer-events: none; }
      #boot-splash .boot-splash__stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      /* The mark IS the loading indicator — it breathes on its own, so there's
         no separate spinner competing with it for attention. */
      #boot-splash .boot-splash__mark {
        width: 96px; height: 96px;
        animation: boot-splash-breathe 2.4s ease-in-out infinite;
      }
      #boot-splash .boot-splash__label {
        font-size: 12px;
        color: #66738A;
        letter-spacing: 0.2px;
      }
      @keyframes boot-splash-breathe {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50%      { opacity: 1;    transform: scale(1.03); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash__mark { animation: none; }
      }
    </style>
  </head>
