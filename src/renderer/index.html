<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verql</title>
    <style>
      /* Pre-React boot splash. Lives entirely outside the bundle so it paints
         on the very first frame — bridging the window-shown → JS-evaluated
         gap that used to flash a white page. The React-side <SplashScreen>
         takes over once the bundle mounts, then dismisses this element with
         a short fade. */
      html, body { margin: 0; padding: 0; background: #0B0F16; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0B0F16;
        color: #E8ECF3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        opacity: 1;
        transition: opacity 240ms ease-out;
        -webkit-app-region: drag;
      }
      #boot-splash.boot-splash--leaving { opacity: 0; pointer-events: none; }
      #boot-splash .boot-splash__stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #boot-splash .boot-splash__mark {
        width: 96px; height: 96px;
        animation: boot-splash-breathe 2.4s ease-in-out infinite;
      }
      #boot-splash .boot-splash__spinner {
        width: 18px; height: 18px;
        border: 2px solid #2A3142;
        border-top-color: #41C0FF;
        border-radius: 50%;
        animation: boot-splash-spin 0.9s linear infinite;
      }
      #boot-splash .boot-splash__label {
        font-size: 12px;
        color: #8A93A6;
        letter-spacing: 0.2px;
      }
      @keyframes boot-splash-spin { to { transform: rotate(360deg); } }
      @keyframes boot-splash-breathe {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50%      { opacity: 1;    transform: scale(1.03); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash__mark,
        #boot-splash .boot-splash__spinner { animation: none; }
      }
    </style>
  </head>
  <body class="bg-bg-primary text-white overflow-hidden">
    <div id="boot-splash" aria-label="Loading Verql">
      <div class="boot-splash__stack">
        <!-- Verql brand mark — kept in sync with assets/brand/verql-mark-color.svg.
             Inlined because this splash paints before the React bundle (and Vite's
             asset URLs) are available. Update both files together. -->
        <svg class="boot-splash__mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="verql-vl" gradientUnits="userSpaceOnUse" x1="3.97" y1="2.26" x2="11.60" y2="17.25">
              <stop offset="0%" stop-color="#7C42FB"/>
              <stop offset="55%" stop-color="#5A63F5"/>
              <stop offset="100%" stop-color="#4157E9"/>
            </linearGradient>
            <linearGradient id="verql-vr" gradientUnits="userSpaceOnUse" x1="20.03" y1="2.26" x2="12.77" y2="21.13">
              <stop offset="0%" stop-color="#41C0FF"/>
              <stop offset="100%" stop-color="#25A2F8"/>
            </linearGradient>
            <linearGradient id="verql-vf" gradientUnits="userSpaceOnUse" x1="12.40" y1="14.31" x2="11.67" y2="21.53">
              <stop offset="0%" stop-color="#3D4CE1"/>
              <stop offset="60%" stop-color="#4A6BF6"/>
              <stop offset="100%" stop-color="#4E79FD"/>
            </linearGradient>
          </defs>
          <path d="M 16.51 3.21 Q 17.02 2.26 18.09 2.26 L 21.97 2.26 Q 23.04 2.26 22.53 3.20 L 13.54 19.72 Q 12.77 21.13 11.56 20.08 L 9.97 18.70 Q 8.75 17.65 9.51 16.24 Z" fill="url(#verql-vr)"/>
          <path d="M 1.47 3.20 Q 0.96 2.26 2.03 2.26 L 5.91 2.26 Q 6.98 2.26 7.49 3.20 L 12.66 12.69 Q 13.14 13.57 12.37 14.22 L 9.74 16.48 Q 9.02 17.09 8.57 16.26 Z" fill="url(#verql-vl)"/>
          <path d="M 9.59 16.58 L 12.54 14.12 Q 13.14 13.57 13.30 14.41 C 13.57 16.25 13.34 18.79 12.64 20.46 Q 12.07 21.74 11.10 20.60 C 10.36 19.69 9.73 18.46 9.31 17.62 Q 9.02 17.09 9.59 16.58 Z" fill="url(#verql-vf)"/>
        </svg>
        <div class="boot-splash__spinner"></div>
        <div class="boot-splash__label">Starting Verql…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
