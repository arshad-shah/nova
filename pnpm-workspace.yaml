# Workspace members. The root (`.`) is the Electron app; packages/* holds
# publishable libraries (e.g. @verql/plugin-sdk) that are NOT bundled into the
# app. The root must be listed so Changesets can discover and version the
# `verql` package when cutting a release.
packages:
  - '.'
  - 'packages/*'

# pnpm explicitly recommends `node-linker=hoisted` for Electron apps:
# https://pnpm.io/settings#nodelinker
# Under the default isolated layout pnpm uses symlinks via .pnpm/, and
# electron-builder doesn't dereference deeply enough — transitive deps
# (mime-db, es-object-atoms, get-intrinsic, ...) get dropped from the
# packaged app.asar and the app crashes at launch with
# "Cannot find module 'X'". Hoisted layout produces a real flat
# node_modules — the same structure npm creates — which electron-builder
# packs reliably.
nodeLinker: hoisted

# Native modules that need post-install lifecycle scripts. pnpm 11 blocks
# arbitrary scripts by default; whitelist these explicitly.
allowBuilds:
  better-sqlite3: true
  cpu-features: true
  electron: true
  electron-winstaller: true
  esbuild: true
  ssh2: true

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - '@electron/rebuild'

# Pinned safe-versions for known-vulnerable transitives.
overrides:
  axios@<1.15.1: '>=1.15.1'
  form-data@<2.5.4: '>=2.5.4'
  # form-data 4.x line CVE (via snowflake-sdk -> axios).
  form-data@>=4.0.0 <4.0.6: '>=4.0.6'
  fast-uri@<3.1.2: '>=3.1.2'
  # Pin xmldom to 0.8.x. The 0.9 line made mimeType mandatory in
  # parseFromString, which breaks `plist` (called by electron-builder when
  # parsing the Electron prebuild's Info.plist):
  #   "DOMParser.parseFromString: the provided mimeType 'undefined' is not valid"
  xmldom: 'npm:@xmldom/xmldom@~0.8.13'
  '@xmldom/xmldom': '~0.8.13'
  fast-xml-parser@<4.4.1: '>=4.4.1'
  fast-xml-builder@<1.1.7: '>=1.1.7'
  tough-cookie@<4.1.3: '>=4.1.3'
  yargs-parser@<5.0.1: '>=5.0.1'
  dompurify@<3.4.11: '>=3.4.11'
  follow-redirects@<1.16.0: '>=1.16.0'
  qs@<6.14.1: '>=6.14.1'
  phin@<3.7.1: '>=3.7.1'
  postcss@<8.5.10: '>=8.5.10'
  hono@<4.12.25: '>=4.12.25'
  ip-address@<10.2.0: '>=10.2.0'
  brace-expansion: '>=5.0.6'
  ws@<8.21.0: '>=8.21.0'
  fast-xml-parser@<5.7.0: '>=5.7.0'
  uuid@<11.1.1: '>=11.1.1'
  tmp@<0.2.7: '>=0.2.7'
  tar@<7.5.16: '>=7.5.16'
  esbuild@<0.28.1: '>=0.28.1'
  # Bump vulnerable @babel/core to the patched 7.29.1+, but STAY IN 7.x (<8):
  # unbounded, pnpm resolves to Babel 8.x, whose `loadPartialConfig` requires a
  # callback — the sync call in react-docgen@8 (Storybook's prop extractor)
  # then throws and the Storybook build (site `build:storybook`) fails.
  '@babel/core@<7.29.1': '>=7.29.1 <8'
  # undici 6/7 CVEs — dev/build/test-only (node-gyp -> @electron/rebuild;
  # jsdom -> vitest). Bump the vulnerable 6.x/early-7.x to patched 7.28+, but
  # STAY IN 7.x (^): jsdom 29 needs undici ^7 (uses lib/handler/wrap-handler.js
  # which undici 8 removed), so forcing 8.x breaks the test DOM environment.
  undici@<7.28.0: '^7.28.0'
  # js-yaml <3.15 CVE via read-yaml-file (@changesets/cli). Scope to that
  # consumer and pin to the patched 3.x — do NOT force 4.x (breaking API).
  read-yaml-file>js-yaml: 3.15.0
  # js-yaml 4.x merge-key DoS (via @changesets + electron-builder). Bump to
  # patched 4.x latest; stay in 4.x (^) to avoid the breaking 5.x jump.
  'js-yaml@>=4.0.0 <4.1.2': '^4.1.2'
