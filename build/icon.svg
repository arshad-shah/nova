<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!--
    Verql app icon — Ion edition.
    The ribbon mark on a deep rounded tile. Mirrors the in-app VerqlMark;
    geometry is identical to src/renderer/src/assets/brand/verql-mark-color.svg
    — keep them in sync.
      - rounded tile, rx 232
      - soft drop shadow on the purple ribbon only, so the fold reads at 16px
  -->
  <defs>
    <linearGradient id="vq-tile" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131D31"/><stop offset="1" stop-color="#0A0E18"/>
    </linearGradient>
    <linearGradient id="vq-left" x1="298" y1="238" x2="520" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A5CFF"/><stop offset="1" stop-color="#5B43F6"/>
    </linearGradient>
    <linearGradient id="vq-right" x1="726" y1="238" x2="512" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00D4FF"/><stop offset="1" stop-color="#30B8FF"/>
    </linearGradient>
    <linearGradient id="vq-fold" x1="512" y1="670" x2="512" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F36D6"/><stop offset="0.12" stop-color="#4547E6"/>
      <stop offset="1" stop-color="#3E8BF9"/>
    </linearGradient>
    <filter id="vq-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#060A14" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#vq-tile)"/>
  <polygon points="610,238 842,238 628,670 396,670" fill="url(#vq-right)"/>
  <polygon points="182,238 414,238 628,670 396,670" fill="url(#vq-left)" filter="url(#vq-shadow)"/>
  <path d="M396 670 H628 L527 873 Q512 904 497 873 Z" fill="url(#vq-fold)"/>
</svg>
